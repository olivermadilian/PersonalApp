name: Deploy to GitHub Pages

# Pages serves from the gh-pages branch; this mirrors the dev branch
# there on every push so the live site stays up to date.
on:
  push:
    branches: ["claude/workout-tracker-claude-suggestions-1arhi3"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Mirror to gh-pages
        run: git push --force origin HEAD:gh-pages
